# Source catalogue.
# On the first start (empty sources table) the entries with `active: true` are added.
# After that, sources are managed from the dashboard (Settings → Sources), where this
# catalogue shows up as a list of "recommended sources" to add with one click.
#
# category: main topic, used as a hint by the classifier
#   Politics | Economy | Crypto | Technology | Foreign Affairs | Science | Sports | Culture
# description / description_it: shown in the dashboard in English / Italian
