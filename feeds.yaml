# Catalogo delle fonti.
# Al primo avvio (tabella fonti vuota) vengono aggiunte le voci con `active: true`.
# Dopo, le fonti si gestiscono dalla dashboard (Impostazioni → Fonti), dove questo
# catalogo compare come elenco di "fonti consigliate" da aggiungere con un clic.
#
# category: argomento prevalente, usato come indizio dal classificatore
#   Politics | Economy | Crypto | Technology | Foreign Affairs | Science | Sports | Culture
feeds:
  # --- Notizie generali e geopolitica
  - name: "BBC News - World"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    category: "Foreign Affairs"
    description: "Esteri e geopolitica, copertura globale"
    active: true
  - name: "The Guardian - World"
    url: "https://www.theguardian.com/world/rss"
    category: "Foreign Affairs"
    description: "Esteri, conflitti e diplomazia"
    active: true
  - name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    category: "Foreign Affairs"
    description: "Medio Oriente, Africa, Asia"
    active: true
  - name: "France 24 - English"
    url: "https://www.france24.com/en/rss"
    category: "Foreign Affairs"
    description: "Europa e Africa francofona"
    active: false
  - name: "Deutsche Welle"
    url: "https://rss.dw.com/rdf/rss-en-all"
    category: "Foreign Affairs"
    description: "Germania, Europa centrale e orientale"
    active: false
  - name: "NPR News"
    url: "https://feeds.npr.org/1001/rss.xml"
    category: null
    description: "Notizie generali USA"
    active: true

  # --- Politica ed elezioni
  - name: "NPR Politics"
    url: "https://feeds.npr.org/1014/rss.xml"
    category: "Politics"
    description: "Congresso, Casa Bianca, elezioni USA"
    active: true
  - name: "Politico"
    url: "https://rss.politico.com/politics-news.xml"
    category: "Politics"
    description: "Politica USA, sondaggi e campagne"
    active: true
  - name: "The Hill"
    url: "https://thehill.com/news/feed/"
    category: "Politics"
    description: "Congresso e amministrazione USA"
    active: false
  - name: "The Guardian - US Politics"
    url: "https://www.theguardian.com/us-news/us-politics/rss"
    category: "Politics"
    description: "Politica USA"
    active: false

  # --- Economia, mercati e banche centrali
  - name: "BBC News - Business"
    url: "https://feeds.bbci.co.uk/news/business/rss.xml"
    category: "Economy"
    description: "Economia e aziende"
    active: true
  - name: "CNBC Top News"
    url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"
    category: "Economy"
    description: "Mercati USA e aziende"
    active: true
  - name: "CNBC Economy"
    url: "https://www.cnbc.com/id/20910258/device/rss/rss.html"
    category: "Economy"
    description: "Inflazione, lavoro, Fed"
    active: true
  - name: "MarketWatch - Top Stories"
    url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"
    category: "Economy"
    description: "Mercati finanziari"
    active: false
  - name: "Federal Reserve - Comunicati"
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    category: "Economy"
    description: "Fonte primaria: decisioni e comunicati della Fed"
    active: true
  - name: "BCE - Comunicati stampa"
    url: "https://www.ecb.europa.eu/rss/press.html"
