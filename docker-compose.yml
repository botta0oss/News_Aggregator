services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # CPU-only image; for a local NVIDIA GPU add docker-compose.gpu.yml (see README)
    build:
      context: .
      dockerfile: Dockerfile
    image: news-aggregator-api:cpu
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside compose the database is reachable as "db", not localhost
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./feeds.yaml:/app/feeds.yaml
      - ./frontend:/app/frontend

volumes:
  pgdata:
