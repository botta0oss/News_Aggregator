<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>News × Markets</title>
  <meta name="description" content="Notizie classificate con TypeSafe Jev e previsioni sui mercati Polymarket">
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233987e5'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
  <script src="boot-check.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#view">Vai al contenuto</a>
  <div class="shell" id="shell">
    <!-- Desktop: sidebar with the sections grouped by purpose -->
    <aside class="sidebar" id="sidebar" aria-label="Menu principale" hidden>
      <div class="sidebar-head">
        <a class="brand" href="#/opportunita" aria-label="News × Markets, vai alle opportunità">
          <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--series-blended)"/><path d="M7 22l6-7 5 4 7-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="brand-text">News <span class="brand-x">×</span> Markets</span>
        </a>
        <button class="btn btn-ghost btn-sm btn-icon btn-bare" id="btn-collapse" type="button" aria-label="Riduci il menu" aria-expanded="true" aria-controls="sidebar">
          <span data-icon="sidebar"></span>
        </button>
      </div>
      <nav class="side-nav" id="side-nav" aria-label="Sezioni"></nav>
      <div class="sidebar-foot" id="side-foot"></div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand brand-mobile" href="#/opportunita" aria-label="News × Markets, vai alle opportunità">
            <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--series-blended)"/><path d="M7 22l6-7 5 4 7-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="brand-text">News <span class="brand-x">×</span> Markets</span>
          </a>
          <p class="topbar-status" id="topbar-status" aria-live="polite"></p>
          <div class="actions" id="actions" hidden>
            <div class="menu-wrap admin-only" id="jobs">
              <button class="btn btn-ghost" id="btn-jobs" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="jobs-menu">
                <span data-icon="refresh"></span><span class="spinner" aria-hidden="true"></span><span class="btn-label">Aggiorna</span><span class="chev" aria-hidden="true"><span data-icon="chevron"></span></span>
              </button>
              <div class="menu" id="jobs-menu" role="menu" aria-labelledby="btn-jobs" hidden>
                <button class="menu-item" id="btn-ingest" role="menuitem" type="button">
                  <span data-icon="news"></span><span><b>Aggiorna notizie</b><span class="muted small">Scarica le fonti, classifica e collega ai mercati</span></span>
                </button>
                <button class="menu-item" id="btn-sync" role="menuitem" type="button">
                  <span data-icon="sync"></span><span><b>Aggiorna mercati</b><span class="muted small">Prezzi da Polymarket e collegamento delle notizie</span></span>
                </button>
              </div>
            </div>
          </div>
          <div class="segmented lang-switch" id="lang-switch" role="group" aria-label="Lingua">
            <button class="seg" type="button" data-lang="it" lang="it" aria-pressed="false" title="Italiano">IT</button>
            <button class="seg" type="button" data-lang="en" lang="en" aria-pressed="false" title="English">EN</button>
          </div>
          <button class="btn btn-ghost btn-icon" id="btn-theme" type="button" aria-label="Passa al tema chiaro">
            <span data-icon="sun"></span>
          </button>
        </div>
      </header>

      <div id="banner" class="banner" role="note" hidden></div>

      <main id="view" class="container" tabindex="-1"></main>

      <footer class="footer container" id="footer" hidden>
        <p>Segnali indicativi, non consulenza finanziaria. L'app non piazza ordini su Polymarket.</p>
      </footer>
    </div>
  </div>

  <!-- Mobile: the four sections used most, the rest under "Altro" -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Sezioni principali" hidden></nav>
  <div class="sheet-backdrop" id="more-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="more-title">
      <div class="sheet-head">
        <h2 id="more-title">Tutte le sezioni</h2>
        <button class="btn btn-ghost btn-icon btn-bare" id="btn-more-close" type="button" aria-label="Chiudi"><span data-icon="x"></span></button>
      </div>
      <nav id="sheet-nav" aria-label="Tutte le sezioni"></nav>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
